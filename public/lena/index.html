<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lenas matplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: varm, rolig kokebok for en sliten hverdag – aldri moraliserende
   IDEA: en kjøkkenkalender på kjøleskapsdøra: fire uker, hver dag fire tallerkener
   PICTURE: dagens fire retter som store fotokort øverst, kalenderen under
   COLOUR and TYPE: furugrønn flate, laks støtte, sitron aksent; Young Serif + Figtree
   LAYOUT: toppfelt med «i dag», ukeflik, dagkort; retter åpnes i et ark */
:root{color-scheme:light dark;
--bg:light-dark(#fbfaf7,#121814);--ink:light-dark(#18231c,#eef2ec);--mut:light-dark(#5c6a60,#a6b4aa);
--pine:light-dark(#1f3d2b,#0d2016);--pine2:#2c5a40;--salmon:#ef8a68;--lemon:#f2d43b;
--card:light-dark(#fff,#1b231e);--line:light-dark(#e4e7e0,#2b352e);--chip:light-dark(#eef3ee,#233029)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Young Serif",Georgia,serif;font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.top{background:var(--pine);color:#f2f6f0;padding:18px max(5vw,16px) 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bar b{font-family:"Young Serif",serif;font-weight:400;font-size:20px}.bar b i{font-style:normal;color:var(--lemon)}
.seg{display:flex;gap:3px;background:rgba(255,255,255,.09);border-radius:99px;padding:3px}
.seg button{border:0;background:none;color:#dbe6de;padding:8px 14px;border-radius:99px;min-height:40px;font-size:14px}
.seg button[aria-pressed=true]{background:#f2f6f0;color:var(--pine)}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:16px;scrollbar-width:none}
nav a{flex:none;color:#cfdcd2;text-decoration:none;padding:12px 14px;border-radius:12px 12px 0 0;white-space:nowrap;font-weight:500;font-size:15px}
nav a[aria-current=page]{background:var(--bg);color:var(--ink)}
main{padding:clamp(20px,3vw,40px) max(5vw,16px) 60px}
.view{display:none}.view.on{display:block}
.today{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,2fr);gap:24px;align-items:start;margin-bottom:34px}
.today h1{font-size:clamp(32px,4.4vw,50px)}
.today p{color:var(--mut);margin:10px 0 0}
.start{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;font-size:14px;color:var(--mut)}
.start input{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--card);font-size:16px}
.plates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.plate{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .2s}
.plate:hover{transform:translateY(-3px)}
.ph{aspect-ratio:4/3;background:var(--chip);position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph svg{position:absolute;inset:0;width:100%;height:100%}
.plate .tx{padding:10px 12px 14px}
.plate small{display:block;color:var(--salmon);font-weight:600;font-size:13px}
.plate span{display:block;font-weight:600;line-height:1.3;margin-top:2px}
.weeks{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.weeks button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;min-height:44px;font-weight:600}
.weeks button[aria-pressed=true]{background:var(--pine2);color:#fff;border-color:transparent}
.wfocus{color:var(--mut);margin:0 0 14px}
.days{display:grid;gap:10px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:90px repeat(4,minmax(0,1fr));gap:10px;align-items:center}
.day.now{border:2px solid var(--salmon)}
.day h3{font-size:18px}.day .dn{font-size:13px;color:var(--mut)}
.mini{display:flex;gap:8px;align-items:center;border:0;background:none;text-align:left;padding:4px;border-radius:10px}
.mini:hover{background:var(--chip)}
.mini .ph{width:52px;flex:none;border-radius:8px;aspect-ratio:1}
.mini b{display:block;font-size:12px;color:var(--mut);font-weight:500}.mini em{font-style:normal;font-size:14px;font-weight:600;line-height:1.25;display:block}
.note{grid-column:2/-1;font-size:14px;color:var(--mut);background:var(--chip);border-radius:8px;padding:6px 10px}
.free{font-size:14px;font-weight:600;color:var(--salmon)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 18px}
.filt button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;min-height:40px}
.filt button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
h2.sec{font-size:clamp(28px,3.4vw,40px);margin-bottom:6px}
.lead{color:var(--mut);max-width:65ch;margin:0 0 18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:12px}
.box h3{font-size:20px;margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{text-align:left;padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;border-top:0}
td:first-child{white-space:nowrap;font-weight:600;color:var(--pine2)}
.shop label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.shop input{width:20px;height:20px;margin-top:2px;accent-color:var(--pine2)}
.shop input:checked+span{text-decoration:line-through;color:var(--mut)}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.rest h3{display:flex;gap:8px;align-items:center}.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.rest li{margin:8px 0}.rest li b{display:block}
dialog{border:0;padding:0;border-radius:20px;max-width:760px;width:calc(100% - 24px);background:var(--card);color:var(--ink);box-shadow:0 40px 80px -30px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,20,14,.55)}
.sheet .ph{aspect-ratio:16/9}
.sheet .in{padding:20px 22px 24px}
.sheet h2{font-size:clamp(26px,3.4vw,34px);margin:4px 0 10px}
.why{background:var(--chip);border-left:4px solid var(--lemon);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.meta span{background:var(--chip);border-radius:99px;padding:4px 12px;font-size:14px;white-space:nowrap}
.meta .tr{background:#fff3cf;color:#4a3b05}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.sheet h3{font-size:19px;margin:6px 0}.sheet ul,.sheet ol{padding-left:20px;margin:0}.sheet li{margin:4px 0}
.swap{margin-top:16px;background:light-dark(#fff6f1,#2a1f1a);border:1px solid light-dark(#f6d3c4,#4a3227);border-radius:12px;padding:12px 16px}
.swap h3{color:var(--salmon)}
.x{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#18231c;font-size:22px;z-index:2}
footer{padding:20px max(5vw,16px) 40px;color:var(--mut);font-size:14px;border-top:1px solid var(--line)}
@media(max-width:900px){.today{grid-template-columns:minmax(0,1fr)}.plates{grid-template-columns:repeat(2,minmax(0,1fr))}
 .day{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.day>div:first-child{grid-column:1/-1}.note{grid-column:1/-1}}
@media(max-width:600px){.two{grid-template-columns:minmax(0,1fr)}.day{grid-template-columns:minmax(0,1fr)}.plate span{overflow-wrap:anywhere;font-size:15px}.mini .ph{width:44px}}
@media(prefers-reduced-motion:reduce){.plate{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="bar"><b>Lenas <i>matplan</i></b>
    <div class="seg" role="group" aria-label="Språk / Мова"><button data-l="nb" aria-pressed="true">Norsk</button><button data-l="uk" aria-pressed="false">Українська</button></div></div>
  <nav id="nav"></nav>
</div></header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap" id="foot"></div></footer>
<dialog id="dlg"></dialog>
<script>
{
const D={"intro": {"nb": ["Velg 1 frokost, 1 mellommåltid og 2–3 middager for uka – og gjenta dem. Kalenderen viser hva som passer hver dag.", "Når du står opp: frokost (eller overnight-glasset med deg). Ca. kl. 15 på jobb: matboks. 2–3 timer senere: mellommåltid. Kl. 20–21: middag. Pluss 1 frukt.", "Kommer du sent hjem og er lite sulten: halv porsjon ris/pasta/quinoa, men hele porsjonen protein og grønt.", "Mangler du en ingrediens? Åpne retten – under «Bytt slik» står hva du kan bruke i stedet.", "Magen: alt er bakt, kokt eller friskt – ingenting fritert. Chili er alltid valgfritt."], "uk": ["Оберіть 1 сніданок, 1 перекус і 2–3 вечері на тиждень – і повторюйте їх. Календар показує, що їсти щодня.", "Після пробудження – сніданок (або банка нічної вівсянки з собою). Близько 15:00 на роботі – ланчбокс. Через 2–3 години – перекус. О 20–21 – вечеря. Плюс 1 фрукт.", "Якщо повертаєтеся пізно й не голодні: пів порції рису/пасти/кіноа, але повна порція білка та овочів.", "Бракує інгредієнта? Відкрийте страву – у розділі «Замініть так» є варіанти.", "Для шлунка: усе запечене, варене або свіже – нічого смаженого у фритюрі. Чилі завжди за бажанням."]}, "dishes": [{"id": "F1", "cat": "breakfast", "minutes": 4, "ovenMinutes": 0, "lunchbox": false, "kcal": 455, "protein": 30, "name": {"nb": "Eplekake-grøt med salt honning", "uk": "Каша «яблучний пиріг» із солоним медом"}, "why": {"nb": "Honning, peanøttsmør og en klype salt smelter sammen til en rask «salt karamell». Med syrlig eple og kardemomme smaker grøten eplekake, og kald skyr på toppen gir protein og en deilig varm/kald-kontrast.", "uk": "Мед, арахісова паста і дрібка солі разом дають швидку «солону карамель». З кислуватим яблуком і кардамоном каша смакує як яблучний пиріг, а холодний скир зверху дає білок і контраст тепле/холодне."}, "ingredients": {"nb": ["40 g havregryn (1 dl)", "1,5 dl lettmelk", "½ eple, revet", "1 ts honning + 1 ts peanøttsmør + en klype flaksalt", "¼ ts kardemomme + en klype kanel", "150 g skyr naturell", "10 g valnøtter (4–5 halve)"], "uk": ["40 г вівсяних пластівців (1 дл)", "150 мл знежиреного молока (lettmelk)", "½ яблука, натертого", "1 ч. л. меду + 1 ч. л. арахісової пасти + дрібка пластівчастої солі", "¼ ч. л. кардамону + дрібка кориці", "150 г скиру (skyr) натурального", "10 г волоських горіхів (4–5 половинок)"]}, "steps": {"nb": ["Bland havregryn, melk, revet eple og kardemomme i en stor kopp. Mikro i 2 min.", "Rør inn honning og peanøttsmør mens grøten er varm, dryss over litt salt.", "Topp med kald skyr, kanel og knuste valnøtter."], "uk": ["Змішайте пластівці, молоко, яблуко й кардамон у великій чашці. 2 хв у мікрохвильовці.", "Вмішайте мед і арахісову пасту, поки каша гаряча, посипте дрібкою солі.", "Зверху – холодний скир, кориця й подрібнені горіхи."]}, "swaps": {"nb": ["Ingen peanøttsmør? 1 ts mandelsmør eller 5 ekstra valnøtter.", "Ingen skyr? 150 g gresk yoghurt (lett) eller 150 g cottage cheese.", "Ingen eple? ½ pære eller 50 g frosne blåbær.", "Ingen valnøtter? 10 g gresskarkjerner eller mandler."], "uk": ["Немає арахісової пасти? 1 ч. л. мигдальної пасти або ще 5 горіхів.", "Немає скиру? 150 г легкого грецького йогурту або 150 г сиру cottage cheese.", "Немає яблука? ½ груші або 50 г заморожених чорниць.", "Немає волоських горіхів? 10 г гарбузового насіння або мигдалю."]}}, {"id": "F2", "cat": "breakfast", "minutes": 3, "ovenMinutes": 0, "lunchbox": false, "kcal": 350, "protein": 30, "name": {"nb": "Varme blåbær, kald skyr og sort pepper", "uk": "Теплі чорниці, холодний скир і чорний перець"}, "why": {"nb": "Sort pepper og sitronskall får blåbærene til å smake mer av bær – som pepper på jordbær. Varme, syltetøyaktige bær mot kald skyr, og salt havre-crunch mot det søte.", "uk": "Чорний перець і цедра роблять чорниці ще «ягіднішими» – як перець на полуниці. Теплі, як варення, ягоди проти холодного скиру, а солоний хрусткий овес – проти солодкого."}, "ingredients": {"nb": ["200 g skyr naturell", "100 g frosne blåbær", "1 ts honning", "revet skall av ¼ sitron", "2–3 kvern sort pepper", "35 g havre/frø-crunch (fra søndagsprep)"], "uk": ["200 г скиру натурального", "100 г заморожених чорниць", "1 ч. л. меду", "цедра ¼ лимона", "2–3 оберти млинка чорного перцю", "35 г хрусткої суміші овес/насіння (з недільної підготовки)"]}, "steps": {"nb": ["Blåbær og honning i en kopp, 1–1,5 min i mikro. Rør inn pepper og sitronskall.", "Skyr i en bolle, varme bær over.", "Strø crunch på toppen."], "uk": ["Чорниці з медом у чашці – 1–1,5 хв у мікрохвильовці. Додайте перець і цедру.", "Скир у миску, теплі ягоди зверху.", "Посипте хрусткою сумішшю."]}, "swaps": {"nb": ["Ingen blåbær? Bringebær, skogsbær eller frossen mango.", "Ingen crunch klar? 20 g havregryn rett fra posen + 10 g gresskarkjerner.", "Ingen skyr? Gresk yoghurt (lett) eller kvarg."], "uk": ["Немає чорниць? Малина, лісові ягоди або заморожене манго.", "Немає готової суміші? 20 г пластівців просто з пакета + 10 г гарбузового насіння.", "Немає скиру? Легкий грецький йогурт або кварк (kvarg)."]}}, {"id": "F3", "cat": "breakfast", "minutes": 3, "ovenMinutes": 0, "lunchbox": true, "kcal": 410, "protein": 27, "name": {"nb": "Blåbær-kaffe-kardemomme overnight oats", "uk": "Нічна вівсянка: чорниця, кава, кардамон"}, "why": {"nb": "Kaffe og blåbær deler mørke, fruktige aromaer, og kardemomme i kaffe er en gammel arabisk tradisjon. Alt smaker som en kaffebolle med bær – laget kvelden før, klar til å ta med.", "uk": "Кава й чорниця мають спільні темні фруктові аромати, а кардамон у каві – давня арабська традиція. Смакує як кавова булочка з ягодами – готується з вечора, можна взяти з собою."}, "ingredients": {"nb": ["40 g havregryn", "150 g skyr naturell", "1 dl lettmelk", "1 ts pulverkaffe (gjerne koffeinfri)", "¼ ts kardemomme", "75 g frosne blåbær", "1 ts honning", "10 g valnøtter"], "uk": ["40 г вівсяних пластівців", "150 г скиру", "100 мл знежиреного молока", "1 ч. л. розчинної кави (можна без кофеїну)", "¼ ч. л. кардамону", "75 г заморожених чорниць", "1 ч. л. меду", "10 г волоських горіхів"]}, "steps": {"nb": ["Rør kaffen ut i 1 ss varmt vann.", "Rør alt unntatt nøttene sammen i et glass med lokk. Kjøleskap over natten (holder 3 dager).", "Topp med nøtter når du spiser."], "uk": ["Розчиніть каву в 1 ст. л. гарячої води.", "Змішайте все, крім горіхів, у банці з кришкою. У холодильник на ніч (зберігається 3 дні).", "Перед їжею додайте горіхи."]}, "swaps": {"nb": ["Ingen kaffe? Bytt til ½ ts kakao + kanel.", "Ingen blåbær? Frosne bringebær eller revet eple.", "Ingen melk? 1 dl vann eller havredrikk uten sukker."], "uk": ["Немає кави? ½ ч. л. какао + кориця.", "Немає чорниць? Заморожена малина або тертe яблуко.", "Немає молока? 100 мл води або вівсяного напою без цукру."]}}, {"id": "F4", "cat": "breakfast", "minutes": 3, "ovenMinutes": 0, "lunchbox": false, "kcal": 370, "protein": 30, "name": {"nb": "Mango-«lassi»-skyr med kardemomme", "uk": "Скир «ласі» з манго і кардамоном"}, "why": {"nb": "Som i indisk lassi gjør kardemomme mangoen mer blomsteraktig og mindre søt. Salt, ristet crunch gjør det kremete enda tydeligere – samme triks som salt karamell.", "uk": "Як в індійському ласі, кардамон робить манго квітковим і менш солодким. Солоний підсмажений хрумкий овес підкреслює кремовість – той самий трюк, що й у солоній карамелі."}, "ingredients": {"nb": ["200 g skyr naturell", "100 g frossen mango, tint", "revet skall av ¼ sitron + 1 ts saft", "¼ ts kardemomme", "1 ts honning", "35 g havre/frø-crunch"], "uk": ["200 г скиру", "100 г замороженого манго, розмороженого", "цедра ¼ лимона + 1 ч. л. соку", "¼ ч. л. кардамону", "1 ч. л. меду", "35 г хрусткої суміші овес/насіння"]}, "steps": {"nb": ["Sett mangoen i kjøleskapet kvelden før (eller 40 sek i mikro).", "Rør sitronskall, kardemomme og honning inn i skyren.", "Topp med mango, sitronsaft og crunch."], "uk": ["Перекладіть манго в холодильник з вечора (або 40 с у мікрохвильовці).", "Вмішайте в скир цедру, кардамон і мед.", "Зверху – манго, лимонний сік і хрустка суміш."]}, "swaps": {"nb": ["Ingen mango? Fersken på boks (uten sirup) eller banan.", "Ingen kardemomme? Kanel eller vanilje.", "Ingen crunch? 1 ss gresskarkjerner + en klype salt."], "uk": ["Немає манго? Консервовані персики (без сиропу) або банан.", "Немає кардамону? Кориця або ваніль.", "Немає хрусткої суміші? 1 ст. л. гарбузового насіння + дрібка солі."]}}, {"id": "M1", "cat": "main", "minutes": 6, "ovenMinutes": 14, "lunchbox": true, "kcal": 530, "protein": 36, "name": {"nb": "Laks med honning-soya-sennepsglasur", "uk": "Лосось у глазурі мед-соєвий соус-гірчиця"}, "why": {"nb": "Japansk miso-laks virker fordi glasuren er søt, salt og full av umami og karamelliseres på fet fisk. Honning, soya og grov sennep gjør det samme – og rask sitronagurk skjærer gjennom fettet.", "uk": "Японський лосось з місо смачний, бо глазур солодка, солона й багата на умамі та карамелізується на жирній рибі. Мед, соєвий соус і зерниста гірчиця роблять те саме, а швидкий лимонний огірок урівноважує жирність."}, "ingredients": {"nb": ["125 g laksefilet", "glasur: 1 ts honning + 1 ts soyasaus + 1 ts grov sennep", "125 g fullkornsris (ferdigkokt)", "150 g frossen brokkoli", "100 g agurk i tynne skiver + saft av ¼ sitron + salt"], "uk": ["125 г філе лосося", "глазур: 1 ч. л. меду + 1 ч. л. соєвого соусу + 1 ч. л. зернистої гірчиці", "125 г готового цільнозернового рису", "150 г замороженої броколі", "100 г огірка тонкими скибочками + сік ¼ лимона + сіль"]}, "steps": {"nb": ["Ovnen på 200 °C. Rør sammen glasuren og smør den på laksen.", "Laks og frossen brokkoli på samme brett, 12–14 min.", "Bland agurk, sitron og salt. Varm risen og server."], "uk": ["Духовка 200 °C. Змішайте глазур і намажте на лосось.", "Лосось і заморожену броколі на одне деко, 12–14 хв.", "Змішайте огірок, лимон і сіль. Розігрійте рис і подавайте."]}, "swaps": {"nb": ["Ingen laks? 140 g rå kyllingfilet (samme glasur, 20 min i ovnen) eller 160 g torsk/sei (10–12 min).", "Ingen ris? 150 g kokt quinoa, 200 g kokte poteter eller 60 g tørr fullkornspasta.", "Ingen brokkoli? Frosne grønnsaksblandinger, sukkererter eller gulrotstaver.", "Uten matlaging: 125 g varmrøkt laks fra butikken + ferdigris + agurk – glasuren som dressing."], "uk": ["Немає лосося? 140 г сирого курячого філе (та сама глазур, 20 хв у духовці) або 160 г тріски/сайди (torsk/sei, 10–12 хв).", "Немає рису? 150 г вареної кіноа, 200 г вареної картоплі або 60 г сухої цільнозернової пасти.", "Немає броколі? Заморожена овочева суміш, цукровий горошок або морква.", "Без готування: 125 г гарячого копчення лосося з магазину + готовий рис + огірок, глазур – як соус."]}}, {"id": "M2", "cat": "main", "minutes": 5, "ovenMinutes": 14, "lunchbox": true, "kcal": 545, "protein": 41, "name": {"nb": "Karri-eple-laks med quinoa", "uk": "Лосось з карі та яблуком на кіноа"}, "why": {"nb": "Samme logikk som karrisild: varm karri og syrlig eple tar «tyngden» av fet fisk. Den kalde karri-eple-skyren er en lett rémoulade uten majones.", "uk": "Логіка, як у норвезькому оселедці з карі: тепле карі й кислувате яблуко «полегшують» жирну рибу. Холодний соус зі скиру з карі та яблуком – легкий ремулад без майонезу."}, "ingredients": {"nb": ["125 g laksefilet", "1 ts karri", "¼ rødløk (40 g) i båter", "½ eple", "75 g skyr naturell", "150 g kokt quinoa (ca. 50 g tørr)", "1 neve babyspinat (40 g)", "salt"], "uk": ["125 г філе лосося", "1 ч. л. карі", "¼ червоної цибулі (40 г) часточками", "½ яблука", "75 г скиру", "150 г вареної кіноа (бл. 50 г сухої)", "жменька бейбі-шпинату (40 г)", "сіль"]}, "steps": {"nb": ["Ovnen på 200 °C. ½ ts karri og salt på laksen, på brett med rødløken i 12–14 min.", "Riv halve eplet inn i skyren med ½ ts karri og litt salt.", "Spinat og quinoa i bollen, laksen på toppen, karri-eple-skyr ved siden av."], "uk": ["Духовка 200 °C. ½ ч. л. карі й сіль на лосось, разом з цибулею на деко на 12–14 хв.", "Натріть пів яблука в скир, додайте ½ ч. л. карі й трохи солі.", "Шпинат і кіноа в миску, зверху лосось, поруч соус."]}, "swaps": {"nb": ["Ingen laks? 140 g kyllingfilet (20 min) eller 150 g kokte reker (ingen ovn – bare varm løken i panne).", "Ingen quinoa? 125 g ferdig fullkornsris eller 200 g kokte poteter.", "Ingen spinat? Salatmix eller ruccola.", "Uten matlaging: varmrøkt laks + ferdig quinoa/ris i pose + karri-eple-skyr."], "uk": ["Немає лосося? 140 г курячого філе (20 хв) або 150 г варених креветок (без духовки – лише підсмажте цибулю).", "Немає кіноа? 125 г готового цільнозернового рису або 200 г вареної картоплі.", "Немає шпинату? Салатна суміш або рукола.", "Без готування: лосось гарячого копчення + готова кіноа/рис у пакеті + соус з карі."]}}, {"id": "M3", "cat": "main", "minutes": 10, "ovenMinutes": 0, "lunchbox": true, "kcal": 500, "protein": 37, "name": {"nb": "Kaffe-biff med blåbær-viltsaus", "uk": "Яловичина з кавою та чорничним «дичинним» соусом"}, "why": {"nb": "Kaffe og kakao har de samme ristede aromaene som stekeskorpen, så kjøttet smaker grillet etter 3 min. Blåbær gjør jobben tyttebær gjør til vilt, og en skvett soya gir sausen dybde.", "uk": "Кава й какао мають ті самі обсмажені аромати, що й скоринка м'яса, тож яловичина за 3 хв смакує як з гриля. Чорниця працює як брусниця до дичини, а краплина соєвого соусу додає соусу глибини."}, "ingredients": {"nb": ["130 g biffstrimler (storfe)", "½ ts kaffe-kakao-krydder (oppskrift: «Alle retter» → «Signatursauser»)", "1 ts olivenolje", "saus: 60 g frosne blåbær + 1 ts soya + 1 ts sennep + 1 ts honning + 2 ss vann", "125 g fullkornsris", "150 g frossen brokkoli"], "uk": ["130 г яловичини смужками (biffstrimler)", "½ ч. л. кавово-какао спецій (рецепт: «Усі страви» → «Фірмові соуси»)", "1 ч. л. оливкової олії", "соус: 60 г заморожених чорниць + 1 ч. л. соєвого соусу + 1 ч. л. гірчиці + 1 ч. л. меду + 2 ст. л. води", "125 г цільнозернового рису", "150 г замороженої броколі"]}, "steps": {"nb": ["Gni krydderet inn i kjøttet. Stek i olje på høy varme 2–3 min, legg på tallerkenen.", "Alt til sausen i samme panne, småkok 2 min, mos noen bær.", "Brokkoli og ris i mikro. Hell sausen over biffen."], "uk": ["Натріть м'ясо спеціями. Обсмажте на сильному вогні 2–3 хв, перекладіть на тарілку.", "Усе для соусу – в ту саму сковороду, 2 хв на слабкому вогні, розімніть кілька ягід.", "Броколі й рис – у мікрохвильовку. Полийте м'ясо соусом."]}, "swaps": {"nb": ["Ingen biff? 140 g kyllingfilet i strimler (stek 5–6 min) eller 125 g laks (ovn 12 min).", "Ingen blåbær? Tyttebær (rørte, uten sukker) eller frosne bringebær.", "Ingen kaffe-krydder? Salt, pepper og ½ ts røkt paprika.", "Ingen ris? Quinoa, poteter eller fullkornspasta."], "uk": ["Немає яловичини? 140 г курячого філе смужками (5–6 хв) або 125 г лосося (духовка 12 хв).", "Немає чорниць? Брусниця (rørte tyttebær, без цукру) або заморожена малина.", "Немає кавових спецій? Сіль, перець і ½ ч. л. копченої паприки.", "Немає рису? Кіноа, картопля або цільнозернова паста."]}}, {"id": "M4", "cat": "main", "minutes": 12, "ovenMinutes": 0, "lunchbox": true, "kcal": 535, "protein": 47, "name": {"nb": "«Roastbiff-smørbrød» som pasta", "uk": "Паста «бутерброд з ростбіфом»"}, "why": {"nb": "Roastbiff med remulade og agurksalat er Nordens mest elskede smørbrød – med en hemmelig klype karri i remuladen. Her blir det varm pasta: kjent smak, ny form.", "uk": "Ростбіф з ремуладом і огірковим салатом – найулюбленіший північний бутерброд, а в ремуладі є таємна дрібка карі. Тут він стає теплою пастою: знайомий смак у новій формі."}, "ingredients": {"nb": ["60 g fullkornspasta (tørr)", "150 g frossen brokkoli", "130 g biffstrimler", "1 ts olivenolje", "¼ rødløk i tynne båter", "remulade: 60 g skyr + 1 ts sennep + ¼ ts karri + salt", "80 g agurk i terninger + 1 ts sitronsaft + 1 ts dill"], "uk": ["60 г цільнозернової пасти (суха)", "150 г замороженої броколі", "130 г яловичини смужками", "1 ч. л. оливкової олії", "¼ червоної цибулі тонкими часточками", "ремулад: 60 г скиру + 1 ч. л. гірчиці + ¼ ч. л. карі + сіль", "80 г огірка кубиками + 1 ч. л. лимонного соку + 1 ч. л. кропу"]}, "steps": {"nb": ["Kok pastaen, brokkolien i samme kjele de siste 3 min.", "Stek biff og løk i olje på høy varme i 3 min. Bland agurk, sitron og dill.", "Rør remuladen. Vend biff og remulade inn i pastaen, agurken på toppen."], "uk": ["Зваріть пасту, за 3 хв до кінця додайте броколі.", "Обсмажте яловичину з цибулею 3 хв. Змішайте огірок, лимон і кріп.", "Змішайте ремулад. Пасту з'єднайте з м'ясом і соусом, огірок – зверху."]}, "swaps": {"nb": ["Ingen biff? 140 g kylling, 150 g reker eller 100 g ferdig roastbiff fra pålegg-disken (uten steking).", "Ingen pasta? 125 g ris eller 200 g kokte poteter – smaker som potetsalat med roastbiff.", "Ingen dill? Gressløk eller persille.", "Lunsjboks: hold agurken i eget beger."], "uk": ["Немає яловичини? 140 г курки, 150 г креветок або 100 г готового ростбіфу з нарізки (без смаження).", "Немає пасти? 125 г рису або 200 г вареної картоплі – вийде як картопляний салат з ростбіфом.", "Немає кропу? Зелена цибуля або петрушка.", "Для ланчбокса: огірок у окремій баночці."]}}, {"id": "M5", "cat": "main", "minutes": 6, "ovenMinutes": 20, "lunchbox": true, "kcal": 515, "protein": 44, "name": {"nb": "Kardemomme-sitron-kylling på brett", "uk": "Курка з кардамоном і лимоном на деку"}, "why": {"nb": "Kardemomme og sitron har mange av de samme friske aromastoffene – bollekrydderet ditt i en ny rolle. Skyr gjør kyllingen saftig, honning karamelliserer gulrøttene.", "uk": "Кардамон і лимон мають багато спільних свіжих ароматів – ваша «булочна» спеція в новій ролі. Скир робить курку соковитою, а мед карамелізує моркву."}, "ingredients": {"nb": ["140 g kyllingfilet (rå) i biter", "marinade: 50 g skyr + ½ ts kardemomme + skall av ½ sitron + 1 ts honning + salt", "150 g gulrot i staver", "¼ rødløk", "1 ts olivenolje", "125 g fullkornsris", "1 neve spinat"], "uk": ["140 г сирого курячого філе шматочками", "маринад: 50 г скиру + ½ ч. л. кардамону + цедра ½ лимона + 1 ч. л. меду + сіль", "150 г моркви брусочками", "¼ червоної цибулі", "1 ч. л. оливкової олії", "125 г цільнозернового рису", "жменька шпинату"]}, "steps": {"nb": ["Ovnen på 200 °C. Vend kyllingen i marinaden (kan gjøres dagen før).", "Kylling, gulrot og løk på brett, drypp olje over, 20 min.", "Server med ris og spinat, press sitron over."], "uk": ["Духовка 200 °C. Обваляйте курку в маринаді (можна з вечора).", "Курку, моркву й цибулю – на деко, збризніть олією, 20 хв.", "Подавайте з рисом і шпинатом, збризніть лимоном."]}, "swaps": {"nb": ["Ingen kylling? 125 g laks (12–14 min) eller 150 g reker (bare 5 min på brettet til slutt).", "Ingen gulrot? Søtpotet, paprika eller frossen brokkoli.", "Ingen skyr til marinaden? Gresk yoghurt eller 1 ss olje + ekstra sitron.", "Uten matlaging: ferdig grillet kylling uten skinn + ferdigris + spinat + dill-sitron-skyr."], "uk": ["Немає курки? 125 г лосося (12–14 хв) або 150 г креветок (лише 5 хв наприкінці).", "Немає моркви? Батат, болгарський перець або заморожена броколі.", "Немає скиру для маринаду? Грецький йогурт або 1 ст. л. олії + більше лимона.", "Без готування: готова курка-гриль без шкірки + готовий рис + шпинат + соус зі скиру з кропом."]}}, {"id": "M6", "cat": "main", "minutes": 5, "ovenMinutes": 0, "lunchbox": true, "kcal": 540, "protein": 46, "name": {"nb": "Kald satay-kylling med eple og agurk", "uk": "Холодна курка сате з яблуком і огірком"}, "why": {"nb": "Satay-saus bygger på ristet peanøtt, salt og litt søtt. Peanøttsmør, soya, sitron og honning gir det samme på 1 minutt. Friskt eple og agurk gir crunch – spises kald, perfekt matboks.", "uk": "Соус сате – це підсмажений арахіс, сіль і трохи солодкого. Арахісова паста, соєвий соус, лимон і мед дають те саме за хвилину. Свіже яблуко й огірок додають хрускоту – їсться холодним, ідеально для ланчбокса."}, "ingredients": {"nb": ["110 g kokt kyllingfilet (fra søndagsprep) eller grillet kylling uten skinn", "peanøtt-sitron-saus (oppskrift: «Alle retter» → «Signatursauser»)", "150 g kokt quinoa", "100 g agurk", "½ eple", "50 g gulrot", "chiliflak (valgfritt)"], "uk": function mini(k,id){const x=dish(id);if(!x)return `<div class="free">${u("free")}</div>`;

 <div class="box"><h3>${u("tired")}</h3><p>${esc(tr(D.tired))}</p></div>`}
function checked(){try{return JSON.parse(localStorage.getItem("lp_shop")||"{}")}catch(e){return {}}}
function vHandle(){const c=checked();let n=0;const it=(t)=>{const k="i"+(n++);return `<label><input type="checkbox" data-ck="${k}" ${c[k]?"checked":""}><span>${esc(t)}</span></label>`};
 const S=D.shopping;return `<h2 class="sec">${u("nav").handle}</h2>
 <div class="cols3 shop">${S.weekly.map(g=>`<div class="box"><h3>${esc(tr(g.group))}</h3>${tr(g.items).map(it).join("")}</div>`).join("")}
 <div class="box"><h3>${u("pantry")}</h3>${tr(S.pantry).map(it).join("")}</div></div>
 ${S.weekNotes?`<div class="box"><h3>${u("extra")}</h3><ol>${tr(S.weekNotes).map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`:""}
 <button class="filt" style="border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;min-height:44px" id="rs">${u("reset")}</button>`}
function vJobb(){const R=D.restaurant,li=a=>a.map(x=>`<li><b>${esc(tr(x.dish))}</b>${esc(tr(x.how))}</li>`).join("");
 return `<h2 class="sec">Havnelageret</h2><div class="box"><h3>${u("rules")}</h3><ol>${tr(R.rules).map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>
 <div class="cols3 rest"><div class="box"><h3><span class="dot" style="background:#3d8a5a"></span>${u("green")}</h3><ul>${li(R.green)}</ul></div>
 <div class="box"><h3><span class="dot" style="background:#d9a31a"></span>${u("yellow")}</h3><ul>${li(R.yellow)}</ul></div>
 <div class="box"><h3><span class="dot" style="background:#c0533f"></span>${u("red")}</h3><ul>${li(R.red)}</ul></div></div>`}
function vRad(){return `<h2 class="sec">${u("nav").rad}</h2><div class="box">${tr(D.intro).map?`<ul>${tr(D.intro).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:esc(tr(D.intro))}</div>
 <div class="cols3">${D.tips.map(t=>`<div class="box"><h3>${esc(tr(t.title))}</h3><p>${esc(tr(t.text))}</p></div>`).join("")}</div>`}
function openDish(id){const x=dish(id);if(!x)return;const d=$("#dlg");
 d.innerHTML=`<div class="sheet" style="position:relative"><button class="x" id="cx" aria-label="${u("close")}">×</button><div class="ph">${ph(x.id)}</div><div class="in">
 <small style="color:var(--salmon);font-weight:600">${u(x.cat)}</small><h2>${esc(tr(x.name))}</h2>
 <div class="why"><b>${u("why")}:</b> ${esc(tr(x.why))}</div>
 <div class="meta"><span>⏱ ${x.minutes} ${u("min")}</span>${x.ovenMinutes?`<span>${x.ovenMinutes} ${u("oven")}</span>`:""}${x.lunchbox?`<span>${u("box")}</span>`:""}${trainer?`<span class="tr">${x.kcal} kcal · ${x.protein} g protein</span>`:""}</div>
 <div class="two"><div><h3>${u("need")}</h3><ul>${tr(x.ingredients).map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div><div><h3>${u("how")}</h3><ol>${tr(x.steps).map(i=>`<li>${esc(i)}</li>`).join("")}</ol></div></div>
 ${x.swaps?`<div class="swap"><h3>${u("swap")}</h3><ul>${tr(x.swaps).map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`:""}
 ${IMG[x.id]?`<p class="lead" style="font-size:13px;margin:12px 0 0">${u("photo")}</p>`:""}</div></div>`;
 d.showModal();$("#cx").onclick=()=>d.close()}
function render(){document.documentElement.lang=L=="uk"?"uk":"nb";
 document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l==L));
 $("#nav").innerHTML=Object.entries(u("nav")).map(([k,v])=>`<a href="#${k}" ${k==view?'aria-current="page"':""}>${v}</a>`).join("");
 $("#app").innerHTML=({plan:vPlan,retter:vRetter,prep:vPrep,handle:vHandle,jobb:vJobb,rad:vRad}[view]||vPlan)();
 $("#foot").textContent=u("foot")}
function route(){let h=location.hash.slice(1);if(h=="trener"){trainer=true;h="plan"}view=UI.nb.nav[h]?h:"plan";render();window.scrollTo(0,0)}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.l){L=b.dataset.l;try{localStorage.setItem("lp_l",L)}catch(e){}render()}
 else if(b.dataset.dish)openDish(b.dataset.dish);
 else if(b.dataset.wk){wk=+b.dataset.wk;render()}
 else if(b.dataset.cat){cat=b.dataset.cat;render()}
 else if(b.id=="rs"){try{localStorage.removeItem("lp_shop")}catch(e){}render()}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.id=="sd"){try{localStorage.setItem("lp_start",t.value)}catch(e){}const n=dayIndex();wk=n!=null?Math.floor(n/7)+1:1;render()}
 if(t.dataset.ck){const c=checked();c[t.dataset.ck]=t.checked;try{localStorage.setItem("lp_shop",JSON.stringify(c))}catch(e){}}});
$("#dlg").addEventListener("click",e=>{if(e.target.id=="dlg")e.target.close()});
const i0=dayIndex();wk=i0!=null?Math.floor(i0/7)+1:1;
window.addEventListener("hashchange",route);route();
}
</script>
</body>
</html>
